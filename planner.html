    <main class="container">
        <!-- 상단바 -->
        <div class="plannerTop">
            <button type="button" class="plannerBack" aria-label="뒤로" onclick="history.back()">←</button>
            <h1>굿즈 플래너</h1>

            <div class="currencyBox">
                <div class="currencyToggle" role="group" aria-label="통화 선택">
                    <button type="button" class="active" data-currency="JPY" aria-pressed="true">¥</button>
                    <button type="button" data-currency="KRW" aria-pressed="false">₩</button>
                    <button type="button" data-currency="USD" aria-pressed="false">$</button>
                </div>
                <small id="rateInfo">환율 정보: 845.66 원</small>
            </div>
        </div>

        <!-- 탭 -->
        <div class="plannerTabs" role="tablist">
            <button type="button" class="active" data-tab="wish" role="tab" aria-selected="true">위시리스트</button>
            <button type="button" data-tab="buy" role="tab" aria-selected="false">구매예정</button>
        </div>

        <div class="plannerLayout">
            <div class="plannerMain">
                <!-- 행사 선택 카드 -->
                <label class="eventPicker">
                    <img id="pickerImage" alt="">
                    <div>
                        <strong id="pickerTitle"></strong>
                        <small id="pickerDate"></small>
                    </div>
                    <span class="pickerArrow" aria-hidden="true">▼</span>
                    <select id="eventSelect" aria-label="행사 선택"></select>
                </label>

                <ul id="plannerList" class="plannerList"></ul>
                <p id="plannerEmpty" class="emptyMessage" hidden>담은 굿즈가 없어요.</p>

                <button type="button" id="addGoodsButton" class="addGoodsButton">+ 굿즈 추가하기</button>
            </div>

            <!-- 예상 총액 -->
            <aside class="plannerSummary">
                <span>예상 총액</span>
                <strong id="totalPrice">¥ 0</strong>
            </aside>
        </div>
    </main>

    <!-- 굿즈 추가 팝업 -->
    <dialog id="addDialog" class="addDialog">
        <h2>굿즈 추가</h2>
        <ul id="addDialogList" class="addDialogList"></ul>
        <button type="button" id="addDialogClose" class="addGoodsButton">닫기</button>
